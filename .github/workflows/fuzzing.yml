name: Fuzzing

on:
  pull_request:
    paths:
      - '.github/workflows/fuzzing.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'DeltaZulu.Agent.slnx'
      - 'src/DeltaZulu.Pipeline/Inputs/Auditd/**'
      - 'src/DeltaZulu.Pipeline/Inputs/Forwarder/**'
      - 'tests/DeltaZulu.Agent.FuzzTests/**'
      - 'tests/DeltaZulu.Agent.FuzzHarness/**'
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/fuzzing.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'DeltaZulu.Agent.slnx'
      - 'src/DeltaZulu.Pipeline/Inputs/Auditd/**'
      - 'src/DeltaZulu.Pipeline/Inputs/Forwarder/**'
      - 'tests/DeltaZulu.Agent.FuzzTests/**'
      - 'tests/DeltaZulu.Agent.FuzzHarness/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: true
  AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: 1
  AFL_SKIP_BIN_CHECK: 1
  AFL_SKIP_CPUFREQ: 1

jobs:
  fuzz:
    name: ${{ matrix.name }} fuzz smoke test
    runs-on: ubuntu-latest
    container:
      image: aflplusplus/aflplusplus:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Auditd
            seeds: tests/DeltaZulu.Agent.FuzzTests/seeds/auditd
          - name: Forward
            seeds: tests/DeltaZulu.Agent.FuzzTests/seeds/forward

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate GitHub Packages
        run: >-
          dotnet nuget add source https://nuget.pkg.github.com/deltazulu-ou/index.json
          --name deltazulu-github
          --username ${{ github.actor }}
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Restore fuzz projects
        run: |
          dotnet restore tests/DeltaZulu.Agent.FuzzTests/DeltaZulu.Agent.FuzzTests.csproj
          dotnet restore tests/DeltaZulu.Agent.FuzzHarness/DeltaZulu.Agent.FuzzHarness.csproj

      - name: Generate Forward seed corpus
        if: matrix.name == 'Forward'
        env:
          DELTAZULU_FUZZ_SEED_PATH: ${{ github.workspace }}/${{ matrix.seeds }}/valid-batch.bin
        run: |
          dotnet test tests/DeltaZulu.Agent.FuzzTests/DeltaZulu.Agent.FuzzTests.csproj \
            --configuration Release --no-restore \
            --filter FullyQualifiedName=DeltaZulu.Agent.FuzzTests.ParserFuzzTests.GenerateForwardSeedCorpus
          test -s "${{ github.workspace }}/${{ matrix.seeds }}/valid-batch.bin"

      - name: Publish fuzz harness
        run: |
          dotnet publish tests/DeltaZulu.Agent.FuzzHarness/DeltaZulu.Agent.FuzzHarness.csproj \
            --configuration Release --no-restore --output ./publish

      - name: Install SharpFuzz command line
        run: |
          dotnet tool install --global SharpFuzz.CommandLine --version 2.3.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Instrument fuzz target
        run: |
          sharpfuzz ./publish/DeltaZulu.Agent.FuzzHarness.dll
          sharpfuzz ./publish/DeltaZulu.Pipeline.dll
          if [ "${{ matrix.name }}" = "Forward" ]; then
            sharpfuzz ./publish/DeltaZulu.Forward.dll
          fi

      - name: Run AFL++ smoke test
        run: |
          afl-fuzz -i ${{ matrix.seeds }} -o ./findings -V 60 -- \
          dotnet ./publish/DeltaZulu.Agent.FuzzHarness.dll ${{ matrix.name }}

      - name: Upload crash findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.name }}
          path: ./findings/default/crashes/
          if-no-files-found: ignore
